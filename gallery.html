<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Gallery | Noah Diggs</title>
<meta name="description" content="Selected classroom teaching footage from Noah Diggs' music education practice.">
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<link rel="canonical" href="https://noahdiggs.com/gallery.html">
<script src="./support.js"></script>
<script src="./nav.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="ds/styles.css">
<script src="./image-slot.js"></script>
<style>body{margin:0;background:var(--color-bg);font-family:var(--font-sans)}a{color:var(--color-primary)}a:hover{color:var(--color-primary-hover)}</style>
</helmet>

<x-import component="NavBar" from="./ds/components/navigation/NavBar.jsx" links="{{ navLinks }}" active="Gallery" logoSrc="brand/ngjd-logo.svg" onSelect="{{ window.dcNav.navigateTo }}" hint-size="100%,88px"></x-import>

<main>

<div style="padding:clamp(20px, 6vw, 56px) clamp(20px, 6vw, 56px) 24px;background:var(--white);text-align:center">
  <p style="font:var(--text-h1);color:var(--color-text);margin:0 0 12px">Video Gallery</p>
  <p style="font:var(--text-body-lg);color:var(--color-text-muted);max-width:640px;margin:0 auto">Selected classroom teaching footage.</p>
</div>

<section style="padding:var(--space-6) clamp(20px, 6vw, 56px) var(--space-8)">
  <div class="grid-2col" style="max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start">
    <sc-for list="{{ clips }}" as="clip" hint-placeholder-count="2">
      <x-import component="MediaCard" from="./ds/components/cards/MediaCard.jsx" title="{{ clip.title }}" meta="{{ clip.meta }}" kind="video" video-src="{{ clip.videoSrc }}" poster="{{ clip.poster }}" card-style="{{ clip.cardStyle }}" aspect-ratio="9 / 16" hint-size="100%,640px"></x-import>
    </sc-for>
  </div>
</section>

<section style="padding:var(--space-9) clamp(20px, 6vw, 56px)">
  <x-import component="Card" from="./ds/components/cards/Card.jsx" style="{{ ctaCardStyle }}" hint-size="auto,auto">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
      <p style="font:var(--text-h3);color:var(--color-text);margin:0;max-width:560px">Looking to elevate your music department?<br>Let's bring student creativity to center stage!</p>
      <x-import component="Button" from="./ds/components/buttons/Button.jsx" variant="primary" size="lg" onClick="{{ goContact }}" hint-size="auto,54px">Download CV</x-import>
    </div>
  </x-import>
</section>

<footer style="border-top:2px solid var(--ink-900);padding:var(--space-6) clamp(20px, 6vw, 56px);background:var(--white)">
  <div style="max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
    <p style="font:var(--text-small);color:var(--color-text-muted);margin:0"><a href="https://www.linkedin.com/in/noahdiggs/" target="_blank" rel="noopener">LinkedIn</a> · noahtheartsworker@gmail.com</p>
    <img src="brand/ngjd-logo.svg" style="height:56px;width:auto;flex:none" alt="Noah Gabriel Juliana Diggs monogram">
    <p style="font:var(--text-small);color:var(--color-text-muted);margin:0"><a href="about.html">About</a> · <a href="contact.html">Contact</a></p>
  </div>
</footer>

</main>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  CLIPS = [
    {
      title: 'Garden Song: Choir Practice',
      meta: "Practice video for Grades 1–2, used to learn the lyrics, melody, and movement for their choir performance",
      videoSrc: 'https://res.cloudinary.com/xmobf5bj/video/upload/q_auto,w_720/rxhnuuxfrutbiw83qfve.mp4',
      poster: 'https://res.cloudinary.com/xmobf5bj/video/upload/f_jpg,q_auto,w_720/rxhnuuxfrutbiw83qfve.jpg'
    },
    {
      title: 'Grade 1 Warm-Up Sequence',
      meta: "Vocal echo exercises and instrument-holding technique that get young players ready before they pick up their instruments",
      videoSrc: 'https://res.cloudinary.com/xmobf5bj/video/upload/q_auto,w_720/zpm2rzjfmh5bdxyjdros.mp4',
      poster: 'https://res.cloudinary.com/xmobf5bj/video/upload/f_jpg,q_auto,w_720/zpm2rzjfmh5bdxyjdros.jpg'
    }
  ];

  renderVals() {
    return {
      navLinks: ['Home', 'About', 'Contact', 'LinkedIn'],
      window: window,
      goContact: () => window.dcNav.navigateTo('Contact'),
      clips: this.CLIPS.map(c => ({ ...c, cardStyle: { width: '100%' } })),
      ctaCardStyle: { maxWidth: '1120px', margin: '0 auto' }
    };
  }
}

</script>
</body>
</html>
